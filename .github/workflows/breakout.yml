name: Refresh Breakout animation

on:
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency: profile-breakout
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: profile-assets

      - name: Render both themes from the contribution calendar
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/abozanona/pacman-contribution-graph/70945878b1118303b37b88060fc7145e1a57d7b1/dist/pacman-contribution-graph.min.js \
            --output arcade.mjs
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { ArcadeRenderer } from './arcade.mjs';

          for (const [theme, filename] of [['github', 'breakout.svg'], ['github-dark', 'breakout-dark.svg']]) {
            const renderer = new ArcadeRenderer({
              game: 'breakout',
              username: process.env.GITHUB_REPOSITORY_OWNER,
              platform: 'github',
              gameTheme: theme,
              githubSettings: { accessToken: process.env.GITHUB_TOKEN },
              svgCallback: svg => writeFileSync(join(process.env.GITHUB_WORKSPACE, filename), svg),
            });
            await renderer.start();
          }
          JS

      - name: Update the animation files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- breakout.svg breakout-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Breakout animation'
            git push origin HEAD:profile-assets
          fi
